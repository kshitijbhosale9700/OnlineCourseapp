
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ course.name }} - Course Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">OnlineCourse</a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h1 class="h3 mb-0">{{ course.name }}</h1>
            </div>

            <div class="card-body">
                <p class="text-muted">{{ course.description }}</p>

                <h2 class="h4 mt-4 mb-3">Course Lessons</h2>

                {% for lesson in course.lessons.all %}
                    <div class="card mb-3">
                        <div class="card-body">
                            <h3 class="h5">
                                {{ forloop.counter }}. {{ lesson.title }}
                            </h3>
                            <p class="mb-0">{{ lesson.content }}</p>
                        </div>
                    </div>
                {% empty %}
                    <div class="alert alert-info">
                        No lessons are available for this course yet.
                    </div>
                {% endfor %}
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
